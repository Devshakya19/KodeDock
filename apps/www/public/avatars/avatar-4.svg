  <line x1="145" y1="147.5" x2="255" y2="147.5" stroke="#F472B6" stroke-width="3"/>

  <!-- Sleek Hair -->
  <path d="M135,125 C135,70 160,55 200,55 C240,55 265,70 265,125 C250,85 230,70 200,70 C170,70 150,85 135,125 Z" fill="#1C1917"/>

  <!-- Code Tag -->
  <rect x="150" y="325" width="100" height="24" rx="12" fill="#190A28" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="200" y="341" font-family="monospace" font-size="11" font-weight="bold" fill="#C084FC" text-anchor="middle">&lt;AI_ENGINE&gt;</text>
</svg>
