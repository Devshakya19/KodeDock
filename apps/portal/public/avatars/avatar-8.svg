<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532D"/>
      <stop offset="100%" stop-color="#052E16"/>
    </linearGradient>
    <linearGradient id="glow8" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" rx="200" fill="url(#bg8)"/>

  <!-- Matrix Background Code streams -->
  <text x="70" y="80" font-family="monospace" font-size="12" fill="#22C55E" opacity="0.3">010101</text>
  <text x="290" y="100" font-family="monospace" font-size="12" fill="#22C55E" opacity="0.3">110010</text>
  <text x="60" y="280" font-family="monospace" font-size="12" fill="#22C55E" opacity="0.3">SHA256</text>
  <text x="280" y="290" font-family="monospace" font-size="12" fill="#22C55E" opacity="0.3">ED25519</text>

  <!-- Body (High Collar Tech Jacket) -->
  <path d="M85,380 C85,280 135,240 200,240 C265,240 315,280 315,380 Z" fill="#052E16"/>
  <path d="M160,200 L160,380 M240,200 L240,380" stroke="#166534" stroke-width="4"/>

  <!-- Neck & Face -->
  <rect x="180" y="190" width="40" height="45" fill="#B27B55" rx="6"/>
  <path d="M140,140 C140,205 160,225 200,225 C240,225 260,205 260,140 C260,105 240,95 200,95 C160,95 140,105 140,140 Z" fill="#D3976C"/>

  <!-- High Collar -->
  <path d="M140,180 L160,240 L240,240 L260,180 Z" fill="#14532D" stroke="url(#glow8)" stroke-width="2"/>

  <!-- Dark Cyber Shades -->
  <rect x="140" y="140" width="120" height="28" rx="6" fill="#090A0F" stroke="#22C55E" stroke-width="3"/>
  <line x1="150" y1="154" x2="250" y2="154" stroke="#22C55E" stroke-width="2"/>

  <!-- Slick Back Hair -->
  <path d="M135,130 C135,75 160,55 200,55 C240,55 265,75 265,130 Z" fill="#0F172A"/>

  <!-- Code Tag -->
  <rect x="140" y="325" width="120" height="24" rx="12" fill="#052E16" stroke="#22C55E" stroke-width="1.5"/>
  <text x="200" y="341" font-family="monospace" font-size="11" font-weight="bold" fill="#22C55E" text-anchor="middle">&lt;SEC_AUDITOR/&gt;</text>
</svg>
