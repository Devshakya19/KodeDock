name: 🐞 Bug Report
description: Create a report to help us improve KodeDock by fixing bugs
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! 
        Before submitting, please search the issue tracker to ensure this bug hasn't already been reported.
  
  - type: input
    id: version
    attributes:
      label: KodeDock Version
      description: What version of KodeDock are you using? (e.g. v1.1.0, or specific commit hash)
      placeholder: e.g. v1.1.0
    validations:
      required: true
  
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which service or component is causing the issue?
      multiple: true
      options:
        - "Frontend (Next.js)"
        - "Core Engine (Rust)"
        - "AI Service (Python)"
        - "Infra Worker (Go)"
        - "Realtime Service (Node)"
        - "CI/CD & Infrastructure"
        - "Other / Unknown"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what went wrong...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Please explain the steps required to duplicate the issue.
      value: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
      
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
      
  - type: textarea
    id: context
    attributes:
      label: Additional Context (Logs, Screenshots)
      description: Add any other context about the problem here, including logs, screenshots, or environment details (OS, Browser).
    validations:
      required: false
