name: KodeDock API Smoke Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api-smoke-test:
    name: Live PostgreSQL 16 & API Gateway Smoke Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kodedock
          POSTGRES_PASSWORD: kodedock_dev_password
          POSTGRES_DB: kodedock_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Monorepo Environment
        uses: ./.github/actions/setup-monorepo
        with:
          turbo-cache-key: 'api-smoke'

      - name: Install PostgreSQL Client
        run: sudo apt-get install -y postgresql-client

      - name: Seed Database Schema & Smoke Test Identities
        run: |
          PGPASSWORD=kodedock_dev_password psql -h localhost -p 5432 -U kodedock -d kodedock_db -v ON_ERROR_STOP=1 -f docker/schema.sql
          PGPASSWORD=kodedock_dev_password psql -h localhost -p 5432 -U kodedock -d kodedock_db -v ON_ERROR_STOP=1 -c "
            INSERT INTO \"user\" (id, name, email, role, \"emailVerified\", \"createdAt\", \"updatedAt\")
            VALUES 
              ('usr_smoke_seller', 'Smoke Test Seller', 'smoke_seller@kodedock.test', 'SELLER', true, NOW(), NOW()),
              ('usr_smoke_buyer', 'Smoke Test Buyer', 'smoke_buyer@kodedock.test', 'BUYER', true, NOW(), NOW())
            ON CONFLICT (id) DO UPDATE SET role = EXCLUDED.role;
          "

      - name: Launch API Gateway & Execute Smoke Tests
        env:
          PORT: '4000'
          DATABASE_URL: 'postgres://kodedock:kodedock_dev_password@localhost:5432/kodedock_db'
          BETTER_AUTH_SECRET: 'kodedock_smoke_test_secret_32_characters_long'
          BETTER_AUTH_URL: 'http://localhost:4000'
          NODE_ENV: 'test'
        run: |
          echo "Starting API Gateway in background..."
          pnpm --filter @kodedock/backend dev &
          API_PID=$!

          echo "Waiting for API Gateway to become responsive on http://localhost:4000/api/health..."
          READY=false
          for i in {1..30}; do
            if curl -s http://localhost:4000/api/health | grep -q "healthy"; then
              echo "API Gateway is healthy and listening on port 4000!"
              READY=true
              break
            fi
            sleep 1
          done

          if [ "$READY" != "true" ]; then
            echo "API Gateway failed to respond within 30 seconds."
            kill $API_PID 2>/dev/null || true
            exit 1
          fi

          echo "Generating cryptographic tokens for smoke test validation..."
          SELLER_TOKEN=$(pnpm exec tsx -e '
            import { signJwt } from "./src/auth/JWT/jwt.service";
            const secret = process.env.BETTER_AUTH_SECRET || "kodedock_smoke_test_secret_32_characters_long";
            console.log(signJwt({
              sub: "usr_smoke_seller",
              email: "smoke_seller@kodedock.test",
              role: "SELLER",
              name: "Smoke Test Seller",
            }, secret, 3600));
          ')

          BUYER_TOKEN=$(pnpm exec tsx -e '
            import { signJwt } from "./src/auth/JWT/jwt.service";
            const secret = process.env.BETTER_AUTH_SECRET || "kodedock_smoke_test_secret_32_characters_long";
            console.log(signJwt({
              sub: "usr_smoke_buyer",
              email: "smoke_buyer@kodedock.test",
              role: "BUYER",
              name: "Smoke Test Buyer",
            }, secret, 3600));
          ')

          echo "Running API smoke tests..."
          
          # 1. Health check (Public)
          echo "Testing GET /api/health"
          curl -sf http://localhost:4000/api/health | grep -q "healthy" || { echo "Health check failed"; kill $API_PID 2>/dev/null || true; exit 1; }

          # 2. Marketplace Products (Public)
          echo "Testing GET /api/products"
          curl -sf http://localhost:4000/api/products | grep -q "success" || { echo "Products endpoint failed"; kill $API_PID 2>/dev/null || true; exit 1; }

          # 3. Studio Settings Suite (SELLER Protected)
          echo "Testing GET /api/studio/settings (with SELLER token)"
          curl -sf -H "Authorization: Bearer $SELLER_TOKEN" http://localhost:4000/api/studio/settings | grep -q "profile" || { echo "Studio settings failed"; kill $API_PID 2>/dev/null || true; exit 1; }

          # 4. Studio CLI Deployment Keys (SELLER Protected)
          echo "Testing GET /api/studio/api-keys (with SELLER token)"
          curl -sf -H "Authorization: Bearer $SELLER_TOKEN" http://localhost:4000/api/studio/api-keys | grep -q "success" || { echo "Studio API keys failed"; kill $API_PID 2>/dev/null || true; exit 1; }

          # 5. Portal Licenses (BUYER Protected)
          echo "Testing GET /api/portal/licenses (with BUYER token)"
          curl -sf -H "Authorization: Bearer $BUYER_TOKEN" http://localhost:4000/api/portal/licenses | grep -q "success" || { echo "Portal licenses failed"; kill $API_PID 2>/dev/null || true; exit 1; }

          # 6. Security Enforcement: Studio routes reject unauthenticated requests with 401
          echo "Testing SECURITY: GET /api/studio/settings without auth returns 401"
          UNAUTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/api/studio/settings)
          if [ "$UNAUTH_STATUS" != "401" ]; then
            echo "Security check failed: expected 401 but got $UNAUTH_STATUS"
            kill $API_PID 2>/dev/null || true
            exit 1
          fi

          # 7. Security Enforcement: Studio routes reject BUYER role with 403 Forbidden
          echo "Testing SECURITY: GET /api/studio/settings with BUYER token returns 403"
          BUYER_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $BUYER_TOKEN" http://localhost:4000/api/studio/settings)
          if [ "$BUYER_STATUS" != "403" ]; then
            echo "Security RBAC check failed: expected 403 but got $BUYER_STATUS"
            kill $API_PID 2>/dev/null || true
            exit 1
          fi

          echo "Executing Unit, Integration & End-to-End Test Matrix..."
          pnpm run test:all || { echo "Automated test matrix failed"; kill $API_PID 2>/dev/null || true; exit 1; }

          echo "All API smoke tests and full 51-test matrix passed with 100% success against live PostgreSQL 16!"
          kill $API_PID 2>/dev/null || true
