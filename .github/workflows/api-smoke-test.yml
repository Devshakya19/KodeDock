name: KodeDock API Smoke Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api-smoke-test:
    name: Live PostgreSQL 16 & API Gateway Smoke Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kodedock
          POSTGRES_PASSWORD: kodedock_dev_password
          POSTGRES_DB: kodedock_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Monorepo Environment
        uses: ./.github/actions/setup-monorepo
        with:
          turbo-cache-key: 'api-smoke'

      - name: Install PostgreSQL Client
        run: sudo apt-get install -y postgresql-client

      - name: Seed Database Schema
        run: |
          PGPASSWORD=kodedock_dev_password psql -h localhost -p 5432 -U kodedock -d kodedock_db -v ON_ERROR_STOP=1 -f docker/schema.sql

      - name: Launch API Server in Background
        env:
          PORT: '4000'
          DATABASE_URL: 'postgres://kodedock:kodedock_dev_password@localhost:5432/kodedock_db'
          BETTER_AUTH_SECRET: 'kodedock_smoke_test_secret_32_characters_long'
          BETTER_AUTH_URL: 'http://localhost:4000'
          NODE_ENV: 'test'
        run: |
          pnpm --filter @kodedock/api dev &
          API_PID=$!
          echo "API_PID=$API_PID" >> $GITHUB_ENV
          
          echo "Waiting for API Gateway to become responsive on http://localhost:4000..."
          for i in {1..30}; do
            if curl -s http://localhost:4000/api/health | grep -q "healthy"; then
              echo "API Gateway is healthy and listening on port 4000!"
              exit 0
            fi
            sleep 1
          done
          echo "API Gateway failed to respond within 30 seconds."
          exit 1

      - name: Execute Endpoint Smoke Test Matrix
        run: |
          echo "Running API smoke tests..."
          
          # 1. Health check
          echo "Testing GET /api/health"
          curl -sf http://localhost:4000/api/health | grep -q "healthy" || { echo "Health check failed"; exit 1; }

          # 2. Marketplace Products
          echo "Testing GET /api/products"
          curl -sf http://localhost:4000/api/products | grep -q "success" || { echo "Products endpoint failed"; exit 1; }

          # 3. Studio Settings Suite
          echo "Testing GET /api/studio/settings"
          curl -sf http://localhost:4000/api/studio/settings | grep -q "profile" || { echo "Studio settings failed"; exit 1; }

          # 4. Studio CLI Deployment Keys
          echo "Testing GET /api/studio/api-keys"
          curl -sf http://localhost:4000/api/studio/api-keys | grep -q "success" || { echo "Studio API keys failed"; exit 1; }

          # 5. Portal Licenses
          echo "Testing GET /api/portal/licenses"
          curl -sf http://localhost:4000/api/portal/licenses | grep -q "success" || { echo "Portal licenses failed"; exit 1; }

          echo "All 5 API smoke tests passed with 100% success against live PostgreSQL 16!"
