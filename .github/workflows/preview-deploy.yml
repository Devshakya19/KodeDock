name: Deployment Preview & Package Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.5.2'
  NEXT_TELEMETRY_DISABLED: '1'
  INTERNAL_API_URL: 'http://localhost:4000'

jobs:
  preview-store:
    name: Vercel – store (apps/store)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storefront Preview Bundle
        run: pnpm --filter @kodedock/store run build
        
      - name: Report Preview Status
        run: echo "Vercel – store preview bundle generated successfully."

  preview-portal:
    name: Vercel – portal (apps/portal)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Developer Portal Preview Bundle
        run: pnpm --filter @kodedock/portal run build

      - name: Report Preview Status
        run: echo "Vercel – portal preview bundle generated successfully."

  preview-ui-library:
    name: Vercel – ui-library (@kodedock/ui)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify UI Package Compilation
        run: pnpm --filter @kodedock/ui run typecheck

      - name: Report Status
        run: echo "Vercel – ui-library tokens verified."

  preview-api-gateway:
    name: KodeDock Gateway – api (api/)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API Gateway
        run: pnpm --filter @kodedock/api run build

      - name: Report Status
        run: echo "KodeDock Gateway bundle verified."
