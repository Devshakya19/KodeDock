name: Database Schema Drift Detection

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'docker/schema.sql'
      - 'src/db/**'
      - 'docker/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema-parity-check:
    name: Schema Parity (docker/schema.sql vs src/db/schema.sql)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify DDL Schema Parity
        run: |
          echo "Comparing docker/schema.sql and src/db/schema.sql..."
          diff -u --strip-trailing-cr docker/schema.sql src/db/schema.sql || {
            echo "ERROR: Database DDL schema files are out of sync!"
            echo "Ensure both docker/schema.sql and src/db/schema.sql match identically."
            exit 1
          }
          echo "Schema parity verified successfully! Zero drift detected."

  sql-syntax-audit:
    name: PostgreSQL Syntax & Constraint Validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kodedock
          POSTGRES_PASSWORD: kodedock_dev_password
          POSTGRES_DB: kodedock_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get install -y postgresql-client

      - name: Execute Full DDL & Check for Syntax Warnings
        run: |
          PGPASSWORD=kodedock_dev_password psql -h localhost -p 5432 -U kodedock -d kodedock_test_db -v ON_ERROR_STOP=1 -f docker/schema.sql

      - name: Verify Foreign Key References & Indexes
        run: |
          PGPASSWORD=kodedock_dev_password psql -h localhost -p 5432 -U kodedock -d kodedock_test_db -c "
            SELECT conname AS constraint_name, conrelid::regclass AS table_name, confrelid::regclass AS referenced_table
            FROM pg_constraint
            WHERE contype = 'f';
          "
