name: KodeDock CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. RUST BACKEND VERIFICATION (Axum, SQLx, Tokio, Zero-Float Math Engine)
  # =========================================================================
  backend:
    name: Backend Rust Verification (fmt, clippy, check, test)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      SQLX_OFFLINE: "true"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Enforce Rust Formatting Standard
        run: cargo fmt --all -- --check

      - name: Run Clippy Linter (-D warnings)
        run: cargo clippy -- -D warnings

      - name: Compile All Targets
        run: cargo check --all-targets

      - name: Execute Unit & Integration Tests
        run: cargo test --all-targets -- --nocapture

  # =========================================================================
  # 2. BUYER & SELLER PLATFORM FRONTEND (Next.js 15, TypeScript, Design System V2)
  # =========================================================================
  platform-ui:
    name: Platform UI (Typecheck & Production Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_API_URL: "http://localhost:8080"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "platform/package-lock.json"

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Next.js Standalone Build
        run: npm run build

  # =========================================================================
  # 3. PUBLIC MARKETING PORTAL (Next.js 15, Marketing UI)
  # =========================================================================
  marketing-ui:
    name: Marketing UI (Typecheck & Production Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kodedock
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "kodedock/package-lock.json"

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Next.js Standalone Build
        run: npm run build

  # =========================================================================
  # 4. CONTAINER ORCHESTRATION INTEGRITY (Docker Compose Validation)
  # =========================================================================
  docker-validation:
    name: Docker Compose Syntax & Compose Config Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose -f docker/docker-compose.yml config --quiet
