name: KodeDock Monorepo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.5.2'
  TURBO_CACHE_DIR: '.turbo'
  NEXT_TELEMETRY_DISABLED: '1'
  INTERNAL_API_URL: 'http://localhost:4000'

jobs:
  # ── 1. Preflight, Standards & Schema Parity ──────────────────────────────
  preflight:
    name: Preflight & Schema Parity Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Typo & Spelling Check
        uses: crate-ci/typos@master
        continue-on-error: true

      - name: Verify DDL Schema Parity (docker/schema.sql vs src/db/schema.sql)
        run: |
          echo "Verifying exact parity between docker/schema.sql and src/db/schema.sql..."
          diff -u --strip-trailing-cr docker/schema.sql src/db/schema.sql || {
            echo "ERROR: Schema drift detected between docker/schema.sql and src/db/schema.sql!"
            exit 1
          }
          echo "Schema parity verified. Zero drift."

      - name: Validate Docker Compose Configuration
        run: |
          docker compose -f docker/docker-compose.yml config

  # ── 2. Typecheck Across Node Versions ────────────────────────────────────
  typecheck:
    name: Typecheck Matrix (Node ${{ matrix.node-version }})
    needs: [preflight]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turbo-typecheck-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-typecheck-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Typecheck Across All Monorepo Packages
        run: pnpm run typecheck

  # ── 3. Production Build Matrix ───────────────────────────────────────────
  build-apps:
    name: Production Build (${{ matrix.app }})
    needs: [typecheck]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ['store', 'portal', 'api']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turbo-build-${{ matrix.app }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-build-${{ matrix.app }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Target Application
        run: pnpm --filter @kodedock/${{ matrix.app }} run build

  # ── 4. PostgreSQL 16 Real Database Validation ────────────────────────────
  database-validation:
    name: PostgreSQL 16 Schema & Constraints Validation
    needs: [preflight]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kodedock
          POSTGRES_PASSWORD: kodedock_dev_password
          POSTGRES_DB: kodedock_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL Client
        run: sudo apt-get install -y postgresql-client

      - name: Execute Full DDL Schema
        run: |
          PGPASSWORD=kodedock_dev_password psql -h localhost -p 5432 -U kodedock -d kodedock_db -v ON_ERROR_STOP=1 -f docker/schema.sql

      - name: Verify Tables & Relational Integrity Constraints
        run: |
          PGPASSWORD=kodedock_dev_password psql -h localhost -p 5432 -U kodedock -d kodedock_db -c "
            SELECT table_name 
            FROM information_schema.tables 
            WHERE table_schema = 'public' 
            ORDER BY table_name;
          "
          PGPASSWORD=kodedock_dev_password psql -h localhost -p 5432 -U kodedock -d kodedock_db -c "
            SELECT COUNT(*) AS total_tables 
            FROM information_schema.tables 
            WHERE table_schema = 'public';
          "

  # ── 5. CI Status Gate Rollup ─────────────────────────────────────────────
  ci-status-gate:
    name: KodeDock Monorepo CI / Master Gate
    needs:
      - preflight
      - typecheck
      - build-apps
      - database-validation
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify All Monorepo Checks Passed
        run: |
          if [[ "${{ needs.preflight.result }}" != "success" || \
                "${{ needs.typecheck.result }}" != "success" || \
                "${{ needs.build-apps.result }}" != "success" || \
                "${{ needs.database-validation.result }}" != "success" ]]; then
            echo "CI Quality Gate Failed. Review upstream matrix jobs."
            exit 1
          fi
          echo "All Monorepo CI checks passed successfully!"
