name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Professional Release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            
            const releaseBody = `
            # 🚀 KodeDock ${tag} is officially live!

            Welcome to the latest major release of **KodeDock**, packed with massive UI upgrades, real-time sync, and critical core engine improvements.

            ## ✨ Key Features & Upgrades
            * 🌟 **Seller Reviews Dashboard**: Brand new analytics page with star distributions and average rating metrics.
            * 🔔 **Interactive Notifications**: Upgraded the static notifications into a Client Component with optimistic "Mark all as read" state management.
            * 🔴 **Dynamic Navbar Badge**: Added a live unread notifications counter badge to the \`SellerNavbar\` that polls automatically.
            * 📦 **Deferred Uploads (Plan A)**: Product images are now safely held in memory until the seller explicitly publishes, preventing storage leaks in SeaweedFS.

            ## 🛡️ Security & Core Engine Fixes
            * **Escrow Exploit Fixed**: Fully authenticated the \`release_escrow\` endpoint.
            * **Atomic Row Locks**: Eliminated double-spending race conditions in wallet and order endpoints.
            * **Database Synchronization**: Successfully rebuilt the volume to guarantee row-level triggers (like \`updated_at\` and \`sales_count\`) fire correctly.

            *Thank you for supporting KodeDock! Built with passion for the Indian developer community 🇮🇳*
            `;

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Release ${tag}`,
              body: releaseBody,
              draft: false,
              prerelease: tag.includes('-rc') || tag.includes('-beta'),
            });
