name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Release Notes
        id: extract_notes
        run: |
          # Get the tag name (e.g., v1.5.0)
          TAG_NAME=${GITHUB_REF#refs/tags/}
          # Strip 'v' from tag to match CHANGELOG.md (e.g., 1.5.0)
          VERSION=${TAG_NAME#v}
          
          # Extract notes from CHANGELOG.md between current tag and the next tag/footer
          # We look for "## [$VERSION]" and print until we hit the next "## [" or "---"
          awk -v tag="## [$VERSION]" '
            index($0, tag) == 1 {flag=1; next}
            /^## \[/ && flag {flag=0; exit}
            /^---/ && flag {flag=0; exit}
            flag {print}
          ' CHANGELOG.md > release_notes.md
          
          echo "Extracted notes:"
          cat release_notes.md

      - name: Create Professional Release
        uses: softprops/action-gh-release@v2
        with:
          name: KodeDock ${{ github.ref_name }}
          body_path: release_notes.md
          draft: false
          prerelease: contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
