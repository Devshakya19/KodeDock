name: Stale Issues & PRs Maintenance

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark & Close Inactive Threads
    runs-on: ubuntu-latest
    steps:
      - name: Stale Action
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 45
          days-before-close: 7
          stale-issue-message: 'This issue has been automatically marked as stale because it has not had recent activity within 45 days. It will be closed in 7 days if no further activity occurs. Thank you for your contributions to KodeDock!'
          stale-pr-message: 'This pull request has been automatically marked as stale due to 45 days of inactivity. It will be closed in 7 days if no new commits or reviews are pushed.'
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          exempt-issue-labels: 'pinned,security,roadmap,confirmed'
          exempt-pr-labels: 'pinned,dependencies,work-in-progress'
