name: Dependency Review & Supply Chain

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Vulnerability & License Check
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Devshakya19'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review Action
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
        continue-on-error: true
