name: Update Contributors

on:
  push:
    branches:
      - main

jobs:
  update-contributors:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Important to allow the bot to commit changes
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate and Inject Contributors HTML
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch contributors using GitHub CLI (built-in on runners) and filter out bots
          CONTRIBUTORS_HTML=$(gh api repos/${{ github.repository }}/contributors --jq 'map(select(.type == "User")) | map("<a href=\"" + .html_url + "\"><img src=\"" + .avatar_url + "&s=64\" width=\"64px;\" alt=\"" + .login + "\"/></a>") | join(" ")')
          
          # HTML Block to inject (Left aligned)
          INJECTION="<p align=\"left\">\n  $CONTRIBUTORS_HTML\n</p>"
          
          # Inject into README.md and CONTRIBUTING.md
          for FILE in README.md CONTRIBUTING.md; do
            if [ -f "$FILE" ]; then
              awk -v repl="$INJECTION" '
              /<!-- readme: contributors -start -->/ {
                print $0
                print repl
                skip = 1
                next
              }
              /<!-- readme: contributors -end -->/ {
                skip = 0
                print $0
                next
              }
              !skip { print $0 }
              ' "$FILE" > tmp.md && mv tmp.md "$FILE"
            fi
          done

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CONTRIBUTING.md
          
          # Only commit if there are changes
          if ! git diff --staged --quiet; then
            git commit -m "chore(contributors): auto-update contributors list"
            git push
          else
            echo "No changes to commit."
          fi
