name: Pull Request Triage & Labeling

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  triage-labels:
    name: Auto-Label / Monorepo Area Triage
    runs-on: ubuntu-latest
    steps:
      - name: Apply Area Labels
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true
