[package]
name = "kodedock-core"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-cors = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json"] }
dotenvy = "0.15"
jsonwebtoken = "9"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono"] }
env_logger = "0.11"
log = "0.4"
argon2 = "0.5"
rand = "0.8"
aws-sdk-s3 = "1"
aws-credential-types = "1"
aws-types = "1"
# Payment + crypto (Razorpay signature verification)
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
aes-gcm = "0.10"
# Rate limiting (X-Forwarded-For aware via SmartIpKeyExtractor)
actix-governor = "0.7"
redis = { version = "1.6.0", features = ["tokio-comp"] }
