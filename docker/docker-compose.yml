# ── KodeDock Production Orchestration Compose Stack ─────────────────────────
name: kodedock

services:
  # ── 1. Primary PostgreSQL 16 Database ────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: kodedock-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kodedock_db
      POSTGRES_USER: kodedock
      POSTGRES_PASSWORD: kodedock_dev_password
    ports:
      - "5432:5432"
    volumes:
      - kodedock_pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kodedock -d kodedock_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - kodedock-net

  # ── 2. In-Memory Redis 7 Queue & Cache ───────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: kodedock-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - kodedock_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - kodedock-net

  # ── 3. API Gateway Microservice (Port 4000) ──────────────────────────────
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: kodedock-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      NODE_ENV: "production"
      DATABASE_URL: "postgres://kodedock:kodedock_dev_password@postgres:5432/kodedock_db"
      REDIS_URL: "redis://redis:6379"
      BETTER_AUTH_SECRET: "kodedock_production_secret_key_32_characters_minimum"
      BETTER_AUTH_URL: "http://api:4000"
      ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:3001,http://localhost:3002"
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"http\").get(\"http://localhost:4000/api/health\", (r) => { process.exit(r.statusCode === 200 ? 0 : 1); })' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - kodedock-net

  # ── 4. Public Marketplace Frontend (Port 3000) ───────────────────────────
  store:
    build:
      context: ..
      dockerfile: docker/Dockerfile.store
    container_name: kodedock-store
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      NODE_ENV: "production"
      INTERNAL_API_URL: "http://api:4000"
      NEXT_PUBLIC_API_URL: "http://localhost:4000"
    networks:
      - kodedock-net

  # ── 5. Creator Studio Dashboard (Port 3001) ──────────────────────────────
  studio:
    build:
      context: ..
      dockerfile: docker/Dockerfile.studio
    container_name: kodedock-studio
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      NODE_ENV: "production"
      INTERNAL_API_URL: "http://api:4000"
      NEXT_PUBLIC_API_URL: "http://localhost:4000"
    networks:
      - kodedock-net

  # ── 6. Buyer Developer Portal (Port 3002) ────────────────────────────────
  portal:
    build:
      context: ..
      dockerfile: docker/Dockerfile.portal
    container_name: kodedock-portal
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3002:3002"
    environment:
      PORT: "3002"
      NODE_ENV: "production"
      INTERNAL_API_URL: "http://api:4000"
      NEXT_PUBLIC_API_URL: "http://localhost:4000"
    networks:
      - kodedock-net

volumes:
  kodedock_pgdata:
    driver: local
  kodedock_redisdata:
    driver: local

networks:
  kodedock-net:
    driver: bridge
