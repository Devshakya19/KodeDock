services:
  # -------------------------------------------------------------
  # 1. Primary PostgreSQL 16 Database with pgvector AI Extension
  # -------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kodedock-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kodedock}
      POSTGRES_USER: ${POSTGRES_USER:-kodedock_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SuperSecretKodedockSecurePassword2026!}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kodedock_admin} -d ${POSTGRES_DB:-kodedock}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - kodedock-net

  # -------------------------------------------------------------
  # 2. Redis 7 Cache, Token Blacklist & WebSocket Pub/Sub
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: kodedock-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-SuperSecretRedisPassword2026!}
    volumes:
      - ./data/redis:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-SuperSecretRedisPassword2026!}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s
    networks:
      - kodedock-net

  # -------------------------------------------------------------
  # 3. SeaweedFS S3-Compatible Object Storage (200GB / 1TB Scale)
  # -------------------------------------------------------------
  storage:
    image: chrislusf/seaweedfs:latest
    container_name: kodedock-storage
    restart: always
    command: "server -s3 -dir=/data/storage -s3.port=8333"
    volumes:
      - ./data/storage:/data/storage
    ports:
      - "${STORAGE_PORT:-8333}:8333"
    networks:
      - kodedock-net

  # -------------------------------------------------------------
  # 4. Local Mailpit (SMTP & Web Mail UI for Auth Verifications)
  # -------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: kodedock-mailpit
    restart: always
    ports:
      - "127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - kodedock-net

  # -------------------------------------------------------------
  # 5. High-Performance Core Rust Backend Engine
  # -------------------------------------------------------------
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: kodedock-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_started
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-kodedock_admin}:${POSTGRES_PASSWORD:-SuperSecretKodedockSecurePassword2026!}@postgres:5432/${POSTGRES_DB:-kodedock}
      REDIS_URL: redis://:${REDIS_PASSWORD:-SuperSecretRedisPassword2026!}@redis:6379
      S3_ENDPOINT: http://storage:8333
      S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET:-kodedock-public-assets}
      S3_VAULT_BUCKET: ${S3_VAULT_BUCKET:-kodedock-vault-deliverables}
      JWT_SECRET: ${JWT_SECRET:-kodedock_jwt_ultra_secret_signing_key_at_least_32_bytes_2026!}
      MASTER_ENCRYPTION_KEY_HEX: ${MASTER_ENCRYPTION_KEY_HEX:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      PORT: 8080
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    networks:
      - kodedock-net

  # -------------------------------------------------------------
  # 6. KodeDock Marketing UI (Landing, Features, Public Showcase)
  # -------------------------------------------------------------
  kodedock-ui:
    build:
      context: ..
      dockerfile: docker/Dockerfile.kodedock
      args:
        NEXT_PUBLIC_PLATFORM_URL: ${NEXT_PUBLIC_PLATFORM_URL:-http://app.localhost}
    container_name: kodedock-marketing-ui
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
    expose:
      - "3000"
    networks:
      - kodedock-net

  # -------------------------------------------------------------
  # 7. KodeDock Platform UI (Buyer, Seller, Explore, Auth)
  # -------------------------------------------------------------
  platform-ui:
    build:
      context: ..
      dockerfile: docker/Dockerfile.platform
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
        NEXT_PUBLIC_MARKETING_URL: ${NEXT_PUBLIC_MARKETING_URL:-http://localhost}
    container_name: kodedock-platform-ui
    restart: always
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
    expose:
      - "3000"
    networks:
      - kodedock-net

  # -------------------------------------------------------------
  # 8. Caddy Automated HTTPS & Edge Reverse Proxy
  # -------------------------------------------------------------
  proxy:
    image: caddy:alpine
    container_name: kodedock-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy_data:/data
      - ./data/caddy_config:/config
    depends_on:
      - backend
      - kodedock-ui
      - platform-ui
    networks:
      - kodedock-net

networks:
  kodedock-net:
    name: kodedock-net
    driver: bridge

