services:
  # PostgreSQL - Primary Database
  postgres:
    image: postgres:16-alpine
    environment:
      TZ: Asia/Kolkata
      POSTGRES_DB: kodedock
      POSTGRES_USER: kodedock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kodedock_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kodedock -d kodedock"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"
    restart: unless-stopped

  # Redis - Cache & Job Queue
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-kodedock_redis_secret}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-kodedock_redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    restart: unless-stopped

  # Frontend - Next.js
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4001
        NEXT_PUBLIC_GITHUB_CLIENT_ID: ${NEXT_PUBLIC_GITHUB_CLIENT_ID}
    ports:
      - "3000:3000"
    environment:
      - TZ=Asia/Kolkata
      - NEXT_PUBLIC_API_URL=http://localhost:4001
      - CORE_ENGINE_URL=http://core-engine:4001
      - JWT_SECRET=${JWT_SECRET:-kodedock-super-secret-jwt-key-change-in-production-2024}
      - SEAWEEDFS_URL=http://seaweedfs:8333
      - SEAWEEDFS_FILER_URL=http://seaweedfs:8888
    depends_on:
      - core-engine
    networks:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"
    restart: unless-stopped

  # Core Engine - Rust (Main API Gateway)
  core-engine:
    build:
      context: ./services/core-engine
      dockerfile: Dockerfile
    ports:
      - "4001:4001"
    environment:
      - TZ=Asia/Kolkata
      - PORT=4001
      - DATABASE_URL=postgres://kodedock:${POSTGRES_PASSWORD:-kodedock_secret}@postgres:5432/kodedock
      - REDIS_URL=redis://:${REDIS_PASSWORD:-kodedock_redis_secret}@redis:6379
      - JWT_SECRET=${JWT_SECRET:-kodedock-super-secret-jwt-key-change-in-production-2024}
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001
      - S3_ENDPOINT=http://seaweedfs:8333
      - S3_ACCESS_KEY=kodedock_seaweed
      - S3_SECRET_KEY=kodedock_seaweed_secret
      - S3_BUCKET=kodedock-media
      - S3_REGION=us-east-1
      - S3_PUBLIC_URL=/api/images
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"
    restart: unless-stopped

  # AI Service - Python (Recommendations & Search)
  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    environment:
      - TZ=Asia/Kolkata
      - PORT=4002
      - REDIS_URL=redis://:${REDIS_PASSWORD:-kodedock_redis_secret}@redis:6379
      - ALLOWED_ORIGINS=http://localhost:3000
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    restart: unless-stopped

  # Infra Worker - Go (Background Jobs & GitHub)
  infra-worker:
    build:
      context: ./services/infra-worker
      dockerfile: Dockerfile
    environment:
      - TZ=Asia/Kolkata
      - REDIS_URL=redis://:${REDIS_PASSWORD:-kodedock_redis_secret}@redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    restart: unless-stopped

  # Real-Time Service - Node.js (WebSocket)
  realtime-service:
    build:
      context: ./services/realtime-service
      dockerfile: Dockerfile
    environment:
      - TZ=Asia/Kolkata
      - PORT=4004
      - REDIS_URL=redis://:${REDIS_PASSWORD:-kodedock_redis_secret}@redis:6379
      - JWT_SECRET=${JWT_SECRET:-kodedock-super-secret-jwt-key-change-in-production-2024}
      - ALLOWED_ORIGINS=http://localhost:3000
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    restart: unless-stopped

  # SeaweedFS - Object Storage (S3-compatible)
  seaweedfs:
    image: chrislusf/seaweedfs:3.76
    ports:
      - "8333:8333" # S3 API
      - "9333:9333" # Master Web UI
      - "8888:8888" # Filer Web UI (File Browser)
    volumes:
      - seaweedfs_data:/data
      - ./config/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    command: "server -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config /etc/seaweedfs/s3.json -volume.max=100 -volume.fileSizeLimitMB=64"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8333"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - backend
      - frontend
    restart: unless-stopped

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  redis_data:
  postgres_data:
  seaweedfs_data:
