services:
  # =============================================================================
  # 1. PostgreSQL 16 - Primary Enterprise Relational Database
  # =============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: kodedock-postgres
    environment:
      TZ: Asia/Kolkata
      POSTGRES_DB: kodedock
      POSTGRES_USER: kodedock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kodedock_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kodedock -d kodedock"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    restart: unless-stopped

  # =============================================================================
  # 2. Redis 7 - Session Revocation & Fast Cache Store
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: kodedock-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-kodedock_redis_secret}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-kodedock_redis_secret}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    restart: unless-stopped

  # =============================================================================
  # 3. SeaweedFS - High-Performance S3-Compatible Object Storage
  # =============================================================================
  seaweedfs:
    image: chrislusf/seaweedfs:3.76
    container_name: kodedock-seaweedfs
    ports:
      - "8333:8333"
      - "9333:9333"
      - "8888:8888"
    volumes:
      - seaweedfs_data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    command: "server -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config /etc/seaweedfs/s3.json -volume.max=100 -volume.fileSizeLimitMB=64"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9333"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend
      - frontend
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    restart: unless-stopped

  # =============================================================================
  # 4. KodeDock Core Engine - Rust Backend API
  # =============================================================================
  core-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kodedock-core
    ports:
      - "4001:4001"
    environment:
      - TZ=Asia/Kolkata
      - PORT=4001
      - DATABASE_URL=postgres://kodedock:${POSTGRES_PASSWORD:-kodedock_secret}@postgres:5432/kodedock
      - REDIS_URL=redis://:${REDIS_PASSWORD:-kodedock_redis_secret}@redis:6379
      - JWT_SECRET=${JWT_SECRET:-kodedock-super-secret-jwt-key-change-in-production-2026}
      - S3_ENDPOINT=http://seaweedfs:8333
      - S3_ACCESS_KEY=kodedock_seaweed
      - S3_SECRET_KEY=kodedock_seaweed_secret
      - S3_BUCKET=kodedock-media
      - S3_REGION=us-east-1
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - backend
      - frontend
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    restart: unless-stopped

  # =============================================================================
  # 5. KodeDock Web Portal - Next.js 16 (React 19)
  # =============================================================================
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4001
        NEXT_PUBLIC_GITHUB_CLIENT_ID: ${NEXT_PUBLIC_GITHUB_CLIENT_ID:-}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    container_name: kodedock-web
    ports:
      - "3000:3000"
    environment:
      - TZ=Asia/Kolkata
      - CORE_ENGINE_URL=http://core-engine:4001
      - JWT_SECRET=${JWT_SECRET:-kodedock-super-secret-jwt-key-change-in-production-2026}
    depends_on:
      core-engine:
        condition: service_healthy
    networks:
      - frontend
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    restart: unless-stopped

# =============================================================================
# Isolated Networks: Zero direct DB access from public or unlinked containers
# =============================================================================
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

# =============================================================================
# Persistent Data Volumes
# =============================================================================
volumes:
  postgres_data:
  redis_data:
  seaweedfs_data:
